name: Release

# 推送 v 开头的 tag 时出全平台包并发布到 GitHub Releases。
#
#   git tag -a v7.0.0 -m "..." && git push origin v7.0.0
on:
  # 手动触发：流水线本身出问题时要能重跑，而不是靠推一个空提交去撞触发条件。
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 发布 Release
  packages: write   # 推 GHCR

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magicd
          POSTGRES_PASSWORD: magicd
          POSTGRES_DB: magicd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magicd"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # 没有这个变量，存储层测试会整包 skip 且退出码 0——
      # 发版流程会静默跳过全部存储测试并放行，比没有测试更糟。
      MAGICD_TEST_DATABASE_URL: postgres://magicd:magicd@localhost:5432/magicd?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser 生成变更日志需要完整历史与 tag。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # 发版前再跑一遍测试，避免把坏版本推出去。
      - name: 测试
        working-directory: server
        run: go test ./... -count=1

      - name: 确认存储层测试真的跑了
        working-directory: server
        run: |
          go test ./internal/store/ -v -count=1 -run '^TestMigrateCreatesAllTables$' 2>&1 | tee /tmp/store.log
          if ! grep -q -- "--- PASS: TestMigrateCreatesAllTables" /tmp/store.log; then
            echo "存储层测试没有真正执行——发版必须建立在真跑过的测试上" >&2
            exit 1
          fi

      # arm64 镜像在 amd64 runner 上构建需要 QEMU 模拟
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
