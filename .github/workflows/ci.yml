name: CI

# 每次推送与 PR 都跑：格式、静态检查、测试、竞态检测、交叉编译。
on:
  push:
    branches:
      - master
      - "refactor/**"
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/ci.yml"
      - ".goreleaser.yaml"
      - "docker-compose.dev.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/ci.yml"
      - ".goreleaser.yaml"
      - "docker-compose.dev.yml"

# 同一分支的新推送会取消仍在跑的旧任务，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magicd
          POSTGRES_PASSWORD: magicd
          POSTGRES_DB: magicd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magicd"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # 存储层测试必须真跑：写一份内存替身来避开数据库，等于把
      # 整个 SQL 层排除在测试之外，而 SQL 层正是 P3 唯一的新增风险面。
      MAGICD_TEST_DATABASE_URL: postgres://magicd:magicd@localhost:5432/magicd?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 检查格式
        working-directory: server
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w ：" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: 静态检查
        working-directory: server
        run: go vet ./...

      - name: 测试
        working-directory: server
        run: go test ./... -count=1

      - name: 确认存储层测试真的跑了
        working-directory: server
        run: |
          go test ./internal/store/ -v -count=1 -run '^TestMigrateCreatesAllTables$' 2>&1 | tee /tmp/store.log
          if ! grep -q -- "--- PASS: TestMigrateCreatesAllTables" /tmp/store.log; then
            echo "存储层测试没有真正执行——可能是 MAGICD_TEST_DATABASE_URL 没生效，或测试被改名了" >&2
            exit 1
          fi

      # Linux runner 自带 gcc，竞态检测可直接跑。
      - name: 竞态检测
        working-directory: server
        run: go test ./... -race -count=1

      - name: 确认依赖清单已整理
        working-directory: server
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod/go.sum 未整理，请运行 go mod tidy" >&2
            exit 1
          fi

  cross-build:
    name: 交叉编译预检
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/magicd

  goreleaser-check:
    name: 校验发布配置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
