# 神奇弹幕配置示例
#
# 这份 YAML 是**导入入口**，不是运行时配置。数据库才是配置的唯一真相，
# magicd run 不读它。
#
# 用法：
#   export MAGICD_DATABASE_URL='postgres://magicd:magicd@localhost:5432/magicd?sslmode=disable'
#   magicd migrate                              # 建表，并创建管理员
#   magicd login -o cookie-main.txt             # 每个账号各扫码登录一次
#   magicd login -o cookie-sub.txt
#   cp config.example.yaml config.yaml
#   magicd import -c config.yaml --owner admin  # 导进数据库
#   magicd run                                  # 启动
#
# 也可以完全不用 YAML：
#   magicd login --save 小号 --owner admin
#   magicd binding add 小号 1706666491
#   # 规则等 P4 的 WebUI 做好后在网页上配
#
# 导入是幂等的：同一份 YAML 导两次结果一致。YAML 里删掉的规则，
# 重新导入后库里也会消失。
#
# 结构是三层嵌套：账号 → 直播间 → 规则。
# 每个「账号-直播间」组合是一个独立的运行单元，有自己的连接、规则与
# 冷却状态。同一直播间被两个账号连接时是两条独立连接，互不知道对方存在。
#
# 不做账号轮换：某个账号失效时只记录错误日志，不会让别的账号顶替。

accounts:
  # ── 账号一：主播自己的号 ────────────────────────────────
  # 用于查看完整的礼物统计（主播号能拿到的字段比小号多），
  # 以及执行房管操作。这个账号下没有配任何发弹幕的规则，
  # 所以它不会说话——这是配置决定的，不是能力限制。
  - name: 主播号
    cookieFile: cookie-main.txt
    rateLimit: 1.5s          # 该账号全部直播间共享，防风控

    rooms:
      - id: "1706666491"
        cooldownGroups:
          moderation: 5s

        rules:
          - name: 广告禁言
            enabled: false     # 默认关闭！确认匹配无误后再改成 true
            on: [danmaku]
            when:
              any:
                - field: text
                  op: regex
                  value: '(加群|私聊|代打|带打)'
                - field: text
                  op: contains
                  value: '违禁词'
            cooldownGroup: moderation
            do:
              - type: block
                hours: 1

          # 把礼物记进日志，便于人工核对统计
          - name: 礼物流水
            on: [gift, guard_buy]
            do:
              - type: log

  # ── 账号二：小号 ──────────────────────────────────────
  # 负责欢迎、答谢与播报。
  - name: 小号
    cookieFile: cookie-sub.txt
    rateLimit: 1.5s

    rooms:
      - id: "1706666491"
        cooldownGroups:
          greeting: 5s
          thanks: 2s

        rules:
          - name: 舰长进场欢迎
            on: [user_enter]
            when:
              field: user.guardLevel
              op: '>'
              value: 0
            # 合并窗口从本轮首个事件起算固定时长：不论期间又来多少人，
            # 3 分钟一到就结算，不会被之后进场的人拖后。
            #
            # minCount 决定人少时的行为：不足 4 人则不合并，
            # 每人单独欢迎——一个人被说成「欢迎 某某」比合并句式自然。
            #
            # 这个窗口顺带解决了同一次进场的重复事件：B 站会同时下发
            # ENTRY_EFFECT（只有 UID）与 INTERACT_WORD_V2（含昵称），
            # 窗口内按 UID 合并后取非空昵称。
            aggregate:
              window: 3m
              minCount: 4
              by: type
            cooldownGroup: greeting
            do:
              - type: danmaku
                template:
                  - '欢迎{{join .users "、"}}回家~'
                  - '{{join .users "、"}}来啦！'

          - name: 礼物答谢
            on: [gift]
            # 按「用户+礼物」合并，连击会累加数量。
            # 只监听 gift 不监听 gift_combo——两者重复计数。
            #
            # when 里排除盲盒：盲盒也是 gift 事件，不排除的话它会被这条
            # 通用规则按「爆出来的那个礼物」答谢一遍，再被下面的盲盒规则
            # 答谢一遍——同一次投喂谢两次，而且第一次说的还是错的
            #（用户送的是盲盒，不是里面爆出来的东西）。
            when:
              field: gift.isBlindBox
              op: eq
              value: false
            aggregate:
              window: 3s
              by: gift
            cooldownGroup: thanks
            do:
              - type: danmaku
                template:
                  - '感谢{{simplifyName .user.username}}的{{.gift.name}} x{{.gift.count}}！'

          - name: 盲盒答谢
            on: [gift]
            # 盲盒单独一条规则，与常规礼物分开算盈亏。
            #
            # by: blindbox 是按「送礼人 + 盲盒类型」分组——同一个人交叉送
            # 幸运盲盒与心动盲盒时，两者的盈亏必须分开统计，混在一起会得出
            # 完全相反的结论（实测：混算「亏 56 电池」，分开是幸运赚 54、
            # 心动亏 110）。
            when:
              field: gift.isBlindBox
              op: eq
              value: true
            aggregate:
              window: 10s
              by: blindBox
            cooldownGroup: thanks
            do:
              - type: danmaku
                template:
                  # {{int .blindBox.profit}} 而不是直接 {{.blindBox.profit}}：
                  # 字段缺失时（比如手抖忘了配 when: gift.isBlindBox，普通
                  # 礼物也走进了这条按盲盒聚合的规则）.blindBox.profit 会
                  # 渲染成空字符串，gt/lt 直接拿空字符串跟数字比较会报
                  # "incompatible types for comparison" 渲染失败、整条
                  # 答谢发不出去；int 把它安全地转成 0，落到「不赚不亏」
                  # 分支，不炸也不产出一句看起来正常实则错误的话。
                  #
                  # 亏损分支用 profitAbsYuan（不带负号）而不是 profitYuan
                  # （自带负号）：旧版本两者搭配「亏了」用会拼出「亏了 -11
                  # 元」这种双重否定，这是本条规则真实播过的错。
                  - '感谢{{simplifyName .user.username}}的{{.blindBox.name}} x{{.blindBox.count}}，{{if gt (int .blindBox.profit) 0}}赚了{{.blindBox.profitYuan}}元！{{else if lt (int .blindBox.profit) 0}}亏了{{.blindBox.profitAbsYuan}}元！{{else}}不赚不亏！{{end}}'

          - name: 上舰答谢
            on: [guard_buy]
            do:
              - type: danmaku
                template:
                  - '感谢{{simplifyName .user.username}}开通{{.guard.name}}！'

          - name: 关键词回复
            on: [danmaku]
            when:
              field: text
              op: contains
              value: 求歌单
            cooldown: 30s
            do:
              - type: danmaku
                template: ['歌单在主播的动态里哦~']

          - name: 定时提醒
            schedule: '0 */10 * * * *'   # 6 字段含秒：每 10 分钟
            do:
              - type: danmaku
                template: ['喜欢主播的话点个关注吧~']

      # 小号还可以同时在另一个直播间干活，规则完全独立
      # - id: "22222222"
      #   rules:
      #     - name: 打招呼
      #       on: [user_enter]
      #       aggregate: {window: 5s, by: type}
      #       do:
      #         - type: danmaku
      #           template: ['{{join .users "、"}} 你好']
