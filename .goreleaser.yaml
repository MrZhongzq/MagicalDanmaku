# GoReleaser 配置：打 tag 时由 CI 出全平台包并发布到 GitHub Releases。
#
# 目标平台与 ldflags 必须与 scripts/build.sh 保持一致——后者是本地
# 日常验证用的零依赖脚本，两者出的产物应当等价。
#
# 本地预演（不发布、不要求打 tag）：
#   goreleaser release --snapshot --clean
version: 2

project_name: magicd

before:
  hooks:
    - go mod tidy -C server

builds:
  - id: magicd
    dir: server
    main: ./cmd/magicd
    binary: magicd
    # 静态二进制，无 libc 依赖，可直接丢进 scratch 镜像。
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/MrZhongzq/MagicalDanmaku/server/internal/buildinfo.Version={{ .Version }}
      - -X github.com/MrZhongzq/MagicalDanmaku/server/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/MrZhongzq/MagicalDanmaku/server/internal/buildinfo.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - magicd
    # 产物名形如 magicd_v7.0.0_linux_amd64.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Windows 用户多数没有 tar，单独出 zip。
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

# 镜像只做 linux 两个架构：其余四个目标是桌面二进制，不进镜像。
#
# 每个架构先各推一个带架构后缀的 tag，再由下面的 docker_manifests
# 合成一个多架构 manifest——这样 `docker pull ghcr.io/mrzhongzq/magicd`
# 在 amd64 与 arm64 机器上都能自动拿到对的那个。
dockers:
  - id: magicd-amd64
    ids:
      - magicd
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/mrzhongzq/magicd:{{ .Version }}-amd64"
      - "ghcr.io/mrzhongzq/magicd:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.description=神奇弹幕服务端：B 站直播弹幕机器人"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: magicd-arm64
    ids:
      - magicd
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/mrzhongzq/magicd:{{ .Version }}-arm64"
      - "ghcr.io/mrzhongzq/magicd:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.description=神奇弹幕服务端：B 站直播弹幕机器人"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/mrzhongzq/magicd:{{ .Version }}"
    image_templates:
      - "ghcr.io/mrzhongzq/magicd:{{ .Version }}-amd64"
      - "ghcr.io/mrzhongzq/magicd:{{ .Version }}-arm64"
  # latest 只在正式版上移动。
  #
  # prerelease: auto 只管 GitHub Release 上的「预发布」标记，**管不到 Docker
  # tag**——不加这个 skip，推一个 alpha 就会把 latest 指过去，而
  # docker-compose.yml 默认拉的正是 latest。表现是：照 README 走的人静默
  # 拿到预发布版；更糟的是正式版发布之后再发一个 alpha，latest 会**倒退**
  # 回预发布。skip_push: auto 在 prerelease 与 snapshot 时跳过这一条。
  - name_template: "ghcr.io/mrzhongzq/magicd:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/mrzhongzq/magicd:latest-amd64"
      - "ghcr.io/mrzhongzq/magicd:latest-arm64"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # 按提交类型分组，与仓库使用的中文 conventional commits 对应。
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: 新功能
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: 问题修复
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: 性能优化
      regexp: '^perf(\(.+\))?:'
      order: 2
    - title: 其他改动
      order: 999

release:
  draft: false
  prerelease: auto
  footer: |
    ---

    ## 安装

    下载对应平台的压缩包，解压后直接运行 `magicd`。二进制为静态链接，
    无需安装任何运行时依赖。

    校验完整性：
    ```
    sha256sum -c checksums.txt
    ```

    ## Docker

    ```
    docker pull ghcr.io/mrzhongzq/magicd:{{ .Version }}
    ```

    镜像支持 linux/amd64 与 linux/arm64。需要一个 PostgreSQL，
    完整部署见仓库里的 `docker-compose.yml` 与 `docs/deployment.md`。
